<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#120b08"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Tribal Arena</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080504;color:#d8b783;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}#status{text-align:center;padding:24px;font-weight:700;letter-spacing:.08em}.err{color:#ffb0a0}</style></head><body><div id="status">ŁADOWANIE TRIBAL ARENA…</div><script>(async()=>{const status=document.getElementById('status');if(!('DecompressionStream'in window))throw new Error('Ta wersja Safari jest zbyt stara. Zaktualizuj iOS.');let encoded='';for(let i=0;i<9;i++){status.textContent=`ŁADOWANIE TRIBAL ARENA… ${i+1}/9`;const name=`part${String(i).padStart(2,'0')}.txt`;const response=await fetch(name,{cache:'no-store'});if(!response.ok)throw new Error(`Brak pliku ${name} (${response.status})`);encoded+=(await response.text()).trim()}const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()})().catch(error=>{const status=document.getElementById('status');status.className='err';status.textContent='BŁĄD ŁADOWANIA: '+error.message;console.error(error)})</script></body></html>
